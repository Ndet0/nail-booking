<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <script>
      (() => {
        let theme = "dark";
        try {
          if (localStorage.getItem("nailsbychao-theme") === "light") theme = "light";
        } catch {
          // Storage can be blocked. Stay on the dark default.
        }
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#0b0b0b");
      })();
    </script>
    <meta name="description" content="NAILSBYCHAO: nails and makeup by Chao. Home studio and house calls in Kenya. Book online." />
    <title>NAILSBYCHAO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
